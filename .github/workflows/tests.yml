name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - run: ruff check .
      - run: pytest -q
      - name: Headless GUI smoke test with fake sensors
        run: xvfb-run -a env HWLOGGER_SMOKE_TEST=1 timeout 15s python -m hwlogger
