name: Build Linux

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - run: ruff check .
      - run: pytest -q
      - name: Build one-folder release and smoke test
        run: ./scripts/build-pyinstaller.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HWlogger-linux-x86_64
          path: dist/HWlogger-*-linux-x86_64.tar.gz
          if-no-files-found: error
