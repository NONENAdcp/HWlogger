name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Verify tag version
        run: |
          package_version=$(python -c 'from hwlogger import __version__; print(__version__)')
          test "v${package_version}" = "$GITHUB_REF_NAME"
          echo "HWLOGGER_VERSION=${package_version}" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: pytest -q
      - run: ./scripts/build-pyinstaller.sh
      - name: Download appimagetool
        run: |
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/build-appimage.sh
      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum \
            "HWlogger-${HWLOGGER_VERSION}-linux-x86_64.tar.gz" \
            "HWlogger-${HWLOGGER_VERSION}-x86_64.AppImage" \
            > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HWlogger-*-linux-x86_64.tar.gz
            dist/HWlogger-*-x86_64.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
