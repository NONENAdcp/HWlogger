[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwlogger"
dynamic = ["version"]
description = "Read-only Linux hardware sensor monitor and logger"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "PySide6>=6.7",
  "psutil>=5.9",
  "pyqtgraph>=0.13",
  "nvidia-ml-py>=12",
]

[project.gui-scripts]
hwlogger = "hwlogger.app:main"

[project.urls]
Homepage = "https://github.com/NONENAdcp/HWlogger"
Issues = "https://github.com/NONENAdcp/HWlogger/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwlogger = ["resources/*"]

[tool.setuptools.dynamic]
version = {attr = "hwlogger.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
